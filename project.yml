name: SubStore
options:
  bundleIdPrefix: app.squirrel2391
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  SubStore:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Info.plist
        buildPhase: none
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.squirrel2391.cherry3073
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
schemes:
  SubStore:
    build:
      targets:
        SubStore: all
    run:
      config: Release
    archive:
      config: Release
