name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Toolchain
        run: xcodebuild -version; sw_vers

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SubStore.xcodeproj -scheme SubStore \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tail -60

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SubStore.app Payload/
          zip -qry SubStore.ipa Payload
          ls -lh SubStore.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SubStore-unsigned
          path: SubStore.ipa
